# Copy to /data/coolify/proxy/dynamic/azadichords-staging.yml
# Routes staging.azadichords.com to the PM2 process on port 3700.
http:
  routers:
    azadichords-staging-http:
      rule: "Host(`staging.azadichords.com`)"
      entryPoints:
        - http
      middlewares:
        - azadichords-staging-redirect-https
      service: azadichords-staging

    azadichords-staging-https:
      rule: "Host(`staging.azadichords.com`)"
      entryPoints:
        - https
      service: azadichords-staging
      tls:
        certResolver: letsencrypt

  middlewares:
    azadichords-staging-redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    azadichords-staging:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3700"
        passHostHeader: true
