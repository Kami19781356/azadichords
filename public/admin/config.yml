backend:
  name: github
  repo: AZadichords/azadichords-site
  branch: master
  api_root: https://gitea-dscyrlmmaf5dfm1jzyzkfm7u.178.104.193.74.sslip.io/api/v1
  base_url: https://gitea-dscyrlmmaf5dfm1jzyzkfm7u.178.104.193.74.sslip.io
  auth_endpoint: login/oauth/authorize

publish_mode: simple
media_folder: public/images/uploads
public_folder: /images/uploads

# Bilingual convention: every editorial text field is a pair —
# fieldName_en / fieldName_fa. The site currently only renders _en;
# _fa is captured now so nothing has to be re-modeled later, whether
# that's a real i18n toggle on this same CMS or a migration to
# something with native i18n (Payload, etc). _fa fields are optional —
# leave blank until you have a translation.

collections:
  - name: pages
    label: Pages
    files:
      - name: nav
        label: Navigation
        file: content/pages/nav.yml
        fields:
          - { name: brand, label: "Brand Name (not translated)", widget: string }
          - { name: tagline_en, label: "Tagline EN (under the wordmark)", widget: string }
          - { name: tagline_fa, label: "Tagline FA", widget: string, required: false }
          - name: links
            label: Nav Links
            widget: list
            fields:
              - { name: href, label: "Link (e.g. /music)", widget: string }
              - { name: label_en, label: Label EN, widget: string }
              - { name: label_fa, label: Label FA, widget: string, required: false }

      - name: home
        label: Home / Hero
        file: content/pages/home.yml
        fields:
          - { name: eyebrow_en, label: Eyebrow EN, widget: string }
          - { name: eyebrow_fa, label: Eyebrow FA, widget: string, required: false }
          - { name: title, label: "Title (wordmark, not translated)", widget: string }
          - { name: subhead_en, label: Subhead EN, widget: text }
          - { name: subhead_fa, label: Subhead FA, widget: text, required: false }
          - { name: ctaPrimaryLabel_en, label: "Primary Button Label EN", widget: string }
          - { name: ctaPrimaryLabel_fa, label: "Primary Button Label FA", widget: string, required: false }
          - { name: ctaPrimaryHref, label: "Primary Button Link (fallback only — button opens an inline player)", widget: string }
          - { name: ctaSecondaryLabel_en, label: "Secondary Button Label EN", widget: string }
          - { name: ctaSecondaryLabel_fa, label: "Secondary Button Label FA", widget: string, required: false }
          - { name: ctaSecondaryHref, label: "Secondary Button Link", widget: string }
          - { name: scrollHint_en, label: "Scroll Hint Text EN", widget: string }
          - { name: scrollHint_fa, label: "Scroll Hint Text FA", widget: string, required: false }
          - { name: promoBarLabel_en, label: "Promo Strip Text EN (below hero buttons)", widget: string }
          - { name: promoBarLabel_fa, label: "Promo Strip Text FA", widget: string, required: false }
          - { name: promoBarHref, label: "Promo Strip Link", widget: string }

      - name: manifesto
        label: Manifesto
        file: content/pages/manifesto.yml
        fields:
          - { name: eyebrow_en, label: Eyebrow EN, widget: string }
          - { name: eyebrow_fa, label: Eyebrow FA, widget: string, required: false }
          - { name: title_en, label: Title EN, widget: string }
          - { name: title_fa, label: Title FA, widget: string, required: false }
          - { name: imageCaption, label: "Image Placeholder Caption", widget: string }
          - { name: paragraphs_en, label: Paragraphs EN, widget: list, field: { name: paragraph, widget: text } }
          - { name: paragraphs_fa, label: Paragraphs FA, widget: list, field: { name: paragraph, widget: text }, required: false }
          - { name: closing_en, label: Closing Line EN, widget: text }
          - { name: closing_fa, label: Closing Line FA, widget: text, required: false }
          - { name: ctaLabel_en, label: "CTA Label EN", widget: string }
          - { name: ctaLabel_fa, label: "CTA Label FA", widget: string, required: false }
          - { name: ctaHref, label: "CTA Link", widget: string }

      - name: music
        label: Music (page framing)
        file: content/pages/music.yml
        fields:
          - { name: eyebrow_en, label: Eyebrow EN, widget: string }
          - { name: eyebrow_fa, label: Eyebrow FA, widget: string, required: false }
          - { name: title_en, label: Title EN, widget: string }
          - { name: title_fa, label: Title FA, widget: string, required: false }
          - { name: intro_en, label: Intro EN, widget: text }
          - { name: intro_fa, label: Intro FA, widget: text, required: false }
          - { name: closing_en, label: Closing Line EN, widget: text }
          - { name: closing_fa, label: Closing Line FA, widget: text, required: false }
          - { name: comingSoonLabel_en, label: "'Coming Soon' Badge Text EN", widget: string }
          - { name: comingSoonLabel_fa, label: "'Coming Soon' Badge Text FA", widget: string, required: false }
          - { name: tracksComingSoonLabel_en, label: "No-Tracks-Yet Text EN", widget: string }
          - { name: tracksComingSoonLabel_fa, label: "No-Tracks-Yet Text FA", widget: string, required: false }
          - { name: videoComingSoonLabel_en, label: "No-Video-Yet Text EN", widget: string }
          - { name: videoComingSoonLabel_fa, label: "No-Video-Yet Text FA", widget: string, required: false }
          - { name: demoComingSoonLabel_en, label: "No-Demo-Yet Text EN", widget: string }
          - { name: demoComingSoonLabel_fa, label: "No-Demo-Yet Text FA", widget: string, required: false }
          - { name: getReleaseLabel_en, label: "'Get This Release' Button Label EN", widget: string }
          - { name: getReleaseLabel_fa, label: "'Get This Release' Button Label FA", widget: string, required: false }
          - { name: getReleaseNote_en, label: "'Get This Release' Note EN (links to /support)", widget: text }
          - { name: getReleaseNote_fa, label: "'Get This Release' Note FA", widget: text, required: false }
          - { name: getReleaseCtaLabel_en, label: "'Get This Release' Note Link Label EN", widget: string }
          - { name: getReleaseCtaLabel_fa, label: "'Get This Release' Note Link Label FA", widget: string, required: false }

      - name: artists_page
        label: Artists (roster page)
        file: content/pages/artists-page.yml
        fields:
          - { name: eyebrow_en, label: Eyebrow EN, widget: string }
          - { name: eyebrow_fa, label: Eyebrow FA, widget: string, required: false }
          - { name: title_en, label: Title EN, widget: string }
          - { name: title_fa, label: Title FA, widget: string, required: false }
          - { name: intro_en, label: Intro EN, widget: text }
          - { name: intro_fa, label: Intro FA, widget: text, required: false }

      - name: activity_page
        label: Activity (page framing)
        file: content/pages/activity.yml
        fields:
          - { name: eyebrow_en, label: Eyebrow EN, widget: string }
          - { name: eyebrow_fa, label: Eyebrow FA, widget: string, required: false }
          - { name: title_en, label: Title EN, widget: string }
          - { name: title_fa, label: Title FA, widget: string, required: false }
          - { name: intro_en, label: Intro EN, widget: text }
          - { name: intro_fa, label: Intro FA, widget: text, required: false }
          - { name: emptyStateNote_en, label: "Text Shown While There's No Activity Yet (EN)", widget: text }
          - { name: emptyStateNote_fa, label: "Same, FA", widget: text, required: false }

      - name: press
        label: Press
        file: content/pages/press.yml
        fields:
          - { name: eyebrow_en, label: Eyebrow EN, widget: string }
          - { name: eyebrow_fa, label: Eyebrow FA, widget: string, required: false }
          - { name: title_en, label: Title EN, widget: string }
          - { name: title_fa, label: Title FA, widget: string, required: false }
          - { name: paragraphs_en, label: Paragraphs EN, widget: list, field: { name: paragraph, widget: text } }
          - { name: paragraphs_fa, label: Paragraphs FA, widget: list, field: { name: paragraph, widget: text }, required: false }

      - name: services
        label: Services
        file: content/pages/services.yml
        fields:
          - { name: eyebrow_en, label: Eyebrow EN, widget: string }
          - { name: eyebrow_fa, label: Eyebrow FA, widget: string, required: false }
          - { name: title_en, label: Title EN, widget: string }
          - { name: title_fa, label: Title FA, widget: string, required: false }
          - { name: intro_en, label: Intro EN, widget: text }
          - { name: intro_fa, label: Intro FA, widget: text, required: false }
          - name: services
            label: Service List
            widget: list
            fields:
              - { name: title_en, label: Title EN, widget: string }
              - { name: title_fa, label: Title FA, widget: string, required: false }
              - { name: description_en, label: Description EN, widget: text }
              - { name: description_fa, label: Description FA, widget: text, required: false }
          - { name: ctaLabel_en, label: "CTA Label EN", widget: string }
          - { name: ctaLabel_fa, label: "CTA Label FA", widget: string, required: false }
          - { name: ctaHref, label: "CTA Link", widget: string }

      - name: submissions
        label: Submissions
        file: content/pages/submissions.yml
        fields:
          - { name: eyebrow_en, label: Eyebrow EN, widget: string }
          - { name: eyebrow_fa, label: Eyebrow FA, widget: string, required: false }
          - { name: title_en, label: Title EN, widget: string }
          - { name: title_fa, label: Title FA, widget: string, required: false }
          - { name: intro_en, label: Intro EN, widget: text }
          - { name: intro_fa, label: Intro FA, widget: text, required: false }
          - { name: guidelines_en, label: Guidelines EN, widget: list, field: { name: line, widget: string } }
          - { name: guidelines_fa, label: Guidelines FA, widget: list, field: { name: line, widget: string }, required: false }
          - { name: note_en, label: "Fine-print Note EN", widget: text }
          - { name: note_fa, label: "Fine-print Note FA", widget: text, required: false }
          - { name: ctaLabel_en, label: "CTA Label EN", widget: string }
          - { name: ctaLabel_fa, label: "CTA Label FA", widget: string, required: false }
          - { name: ctaHref, label: "CTA Link", widget: string }

      - name: support
        label: Support
        file: content/pages/support.yml
        fields:
          - { name: eyebrow_en, label: Eyebrow EN, widget: string }
          - { name: eyebrow_fa, label: Eyebrow FA, widget: string, required: false }
          - { name: title_en, label: Title EN, widget: string }
          - { name: title_fa, label: Title FA, widget: string, required: false }
          - { name: intro_en, label: Intro Paragraphs EN, widget: list, field: { name: paragraph, widget: text } }
          - { name: intro_fa, label: Intro Paragraphs FA, widget: list, field: { name: paragraph, widget: text }, required: false }
          - name: tiers
            label: "Tiers (prices are set in Stripe directly — see docs/SALES_SETUP.md; Tier 2/3 prices are still TODO, not set anywhere yet)"
            widget: list
            fields:
              - { name: name, label: "Tier Label (e.g. Tier 1)", widget: string }
              - { name: title_en, label: Tier Title EN, widget: string }
              - { name: title_fa, label: Tier Title FA, widget: string, required: false }
              - { name: description_en, label: Description EN, widget: text }
              - { name: description_fa, label: Description FA, widget: text, required: false }
              - { name: note_en, label: "Fine-print Note EN (optional)", widget: text, required: false }
              - { name: note_fa, label: "Fine-print Note FA (optional)", widget: text, required: false }
          - { name: ctaLabel_en, label: "CTA Label EN", widget: string }
          - { name: ctaLabel_fa, label: "CTA Label FA", widget: string, required: false }
          - { name: ctaHref, label: "CTA Link", widget: string }
          - { name: transparency_en, label: "Transparency Line EN", widget: text }
          - { name: transparency_fa, label: "Transparency Line FA", widget: text, required: false }

      - name: contact
        label: Contact
        file: content/pages/contact.yml
        fields:
          - { name: eyebrow_en, label: Eyebrow EN, widget: string }
          - { name: eyebrow_fa, label: Eyebrow FA, widget: string, required: false }
          - { name: title_en, label: Title EN, widget: string }
          - { name: title_fa, label: Title FA, widget: string, required: false }
          - { name: subhead_en, label: Subhead EN, widget: text }
          - { name: subhead_fa, label: Subhead FA, widget: text, required: false }
          - { name: fieldNameLabel_en, label: "'Name' Field Label EN", widget: string }
          - { name: fieldNameLabel_fa, label: "'Name' Field Label FA", widget: string, required: false }
          - { name: fieldEmailLabel_en, label: "'Email' Field Label EN", widget: string }
          - { name: fieldEmailLabel_fa, label: "'Email' Field Label FA", widget: string, required: false }
          - { name: fieldSubjectLabel_en, label: "'Subject' Field Label EN", widget: string }
          - { name: fieldSubjectLabel_fa, label: "'Subject' Field Label FA", widget: string, required: false }
          - { name: fieldCategoryLabel_en, label: "'Category' Field Label EN", widget: string }
          - { name: fieldCategoryLabel_fa, label: "'Category' Field Label FA", widget: string, required: false }
          - { name: categories_en, label: "Category Options EN", widget: list, field: { name: category, widget: string } }
          - { name: categories_fa, label: "Category Options FA", widget: list, field: { name: category, widget: string }, required: false }
          - { name: submitLabel_en, label: "Submit Button Label EN", widget: string }
          - { name: submitLabel_fa, label: "Submit Button Label FA", widget: string, required: false }

      - name: footer
        label: Footer
        file: content/pages/footer.yml
        fields:
          - { name: copyright, label: "Copyright Line (not translated)", widget: string }
          - name: social
            label: Social Links
            widget: list
            fields:
              - { name: label, label: "Platform Name (not translated)", widget: string }
              - { name: href, label: URL, widget: string }
          - { name: disclaimer_en, label: "Disclaimer Line EN", widget: text }
          - { name: disclaimer_fa, label: "Disclaimer Line FA", widget: text, required: false }

  - name: artists
    label: Artists
    folder: content/artists
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { name: slug, label: "Slug (URL-safe, e.g. kamran-rasoolzadeh)", widget: string }
      - { name: name, label: "Full Name (not translated)", widget: string }
      - { name: role_en, label: "Role EN (e.g. Poet, Composer, Singer-Songwriter)", widget: string }
      - { name: role_fa, label: Role FA, widget: string, required: false }
      - { name: badge_en, label: "Badge EN (e.g. Founding Artist) — leave blank for none", widget: string, required: false }
      - { name: badge_fa, label: Badge FA, widget: string, required: false }
      - { name: imageCaption, label: "Portrait Placeholder Caption", widget: string }
      - { name: intro_en, label: "Short Intro EN (shown on roster card)", widget: text }
      - { name: intro_fa, label: "Short Intro FA", widget: text, required: false }
      - { name: ctaLabel_en, label: "Profile CTA Label EN", widget: string }
      - { name: ctaLabel_fa, label: "Profile CTA Label FA", widget: string, required: false }
      - { name: ctaHref, label: "Profile CTA Link", widget: string }
      - name: recognition
        label: "Recognition (awards specific to this artist — names of awards/festivals are not translated)"
        widget: list
        required: false
        fields:
          - { name: award, label: "Award / Festival", widget: string }
          - { name: category, label: Category, widget: string }
          - { name: year, label: "Year (leave blank if unconfirmed — don't guess)", widget: string, required: false }
      - { name: bio_en, label: "Full Bio EN", widget: markdown }
      - { name: bio_fa, label: "Full Bio FA", widget: markdown, required: false }
      # Optional — pre-label work (e.g. Kamran/CHESHMAT). Leave
      # priorWorkTitle_en blank to omit this block entirely.
      - { name: priorWorkTitle_en, label: "Prior Work Title EN (leave blank for none)", widget: string, required: false }
      - { name: priorWorkTitle_fa, label: Prior Work Title FA, widget: string, required: false }
      - { name: priorWorkDescription_en, label: Prior Work Description EN, widget: markdown, required: false }
      - { name: priorWorkDescription_fa, label: Prior Work Description FA, widget: markdown, required: false }
      - { name: priorWorkVideoUrl, label: "Prior Work Video URL (YouTube or Vimeo)", widget: string, required: false }

  # One schema for every release — album, single, or EP. Sorted by
  # release_date (see scripts/generate-content.mjs), so whichever entry
  # has the newest date automatically becomes the featured "latest
  # release" on the Music page — no manual ordering field to maintain.
  - name: releases
    label: Releases
    folder: content/releases
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { name: slug, label: "Slug (URL-safe, e.g. cheshmat)", widget: string }
      - { name: title, label: "Release Title (not translated)", widget: string }
      - name: type
        label: Type
        widget: select
        options: [album, single, ep]
        default: album
      - name: artist
        label: Artist
        widget: relation
        collection: artists
        search_fields: [name]
        display_fields: [name]
        value_field: "{{slug}}"
      - name: status
        label: Status
        widget: select
        options: [upcoming, out_now]
        default: upcoming
      - { name: release_date, label: "Release Date (YYYY-MM-DD, or just YYYY if the exact date isn't known yet)", widget: string }
      - { name: coverImageCaption, label: "Cover Placeholder Caption", widget: string }
      - { name: tagline_en, label: "Tagline EN (short, one line)", widget: string }
      - { name: tagline_fa, label: "Tagline FA", widget: string, required: false }
      - { name: description_en, label: Description EN, widget: markdown }
      - { name: description_fa, label: Description FA, widget: markdown, required: false }
      - { name: demo_audio_url, label: "Inline Demo Audio URL (optional)", widget: string, required: false }
      - { name: video_url, label: "Music Video URL (optional)", widget: string, required: false }
      - { name: musicVideoCaption_en, label: "Music Video Caption EN", widget: string, required: false }
      - { name: musicVideoCaption_fa, label: "Music Video Caption FA", widget: string, required: false }
      - name: tracks
        label: Tracks
        widget: list
        required: false
        fields:
          - { name: track_number, label: "Track #", widget: number, value_type: int }
          - { name: title_en, label: Track Title EN, widget: string }
          - { name: title_fa, label: Track Title FA, widget: string, required: false }
          - { name: duration, label: "Duration (e.g. 3:42)", widget: string, required: false }
          - { name: preview_url, label: "Preview Audio URL", widget: string, required: false }
      - name: streaming_links
        label: Streaming Links
        widget: list
        required: false
        fields:
          - name: platform
            label: Platform
            widget: select
            options: [spotify, apple_music, youtube_music, soundcloud, other]
          - { name: url, label: URL, widget: string }
      - { name: support_tier_link, label: "Link this release to the Support tiers?", widget: boolean, default: false }
      - { name: purchaseNote_en, label: "Override 'Get This Release' note EN (optional — leave blank for the site default)", widget: string, required: false }
      - { name: purchaseNote_fa, label: "Override 'Get This Release' note FA (optional)", widget: string, required: false }

  - name: activity
    label: Activity
    folder: content/activity
    create: true
    slug: "{{fields.date}}-{{fields.title_en}}"
    fields:
      - { name: date, label: "Date (e.g. 2027 or March 2027)", widget: string }
      - { name: title_en, label: Title EN, widget: string }
      - { name: title_fa, label: Title FA, widget: string, required: false }
      - { name: link, label: "Link (optional)", widget: string, required: false }
      - { name: body_en, label: Description EN, widget: markdown }
      - { name: body_fa, label: Description FA, widget: markdown, required: false }
