musicVideoSubject_en: Music video submission
musicVideoSubject_fa: ارسالِ موزیک‌ویدیو
musicVideoNote_en: "Music video submission: write your name, email and the video's details (title, director, length, language, and a link to watch it). We'll reply with a FilmFreeway waiver code, or you can send us the link directly."
musicVideoNote_fa: "ارسالِ موزیک‌ویدیو از ایران: نام، ایمیل و مشخصاتِ اثر (عنوان، کارگردان، مدت، زبان و لینکِ تماشای ویدیو) را بنویس. کدِ معافیتِ FilmFreeway (waiver code) را برایت ایمیل می‌کنیم تا اثر را بدونِ پرداختِ هزینه ثبت کنی؛ یا لینکِ ویدیو را مستقیم برایمان بفرست."
