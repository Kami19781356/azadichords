intro_en: "Songs released by Azadichords — streaming everywhere."
intro_fa: "ترانه‌هایی که آکوردهای آزادی منتشر می‌کند. برای مخاطبانِ داخلِ ایران، دانلودشان از همین سایت رایگان است."
closing_en: "Coming next on the label: «Freedom Chords», an international album of the nine winning songs of the festival — chosen from both song sections, in several languages — produced by the Azadichords team."
closing_fa: "انتشارِ بعدیِ لیبل آلبومِ بین‌المللیِ «آکوردهای آزادی» (Freedom Chords) است، با نُه ترانه‌ی برنده‌ی جشنواره که از میانِ آثارِ هر دو بخش و به زبان‌های گوناگون برگزیده می‌شوند؛ با تهیه و تولیدِ تیمِ آکوردهای آزادی."
