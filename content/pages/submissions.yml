eyebrow_fa: ارسال اثر
title_en: For the Next Voice
title_fa: برای صدای بعدی
intro_en: "If your voice is something that can't stay silent, we want to hear it. Azadichords looks for artists whose music and poetry come from a belief, not just a genre. The main door is our festival: every entry is heard by the jury, and selected artists are invited to the label's annual compilation."
intro_fa: "اگر صدایتان چیزی است که نمی‌تواند ساکت بماند، می‌خواهیم آن را بشنویم. آزادی‌کورد به‌دنبالِ هنرمندانی است که موسیقی و شعرشان از یک باور می‌آید، نه فقط از یک ژانر. درِ اصلی، جشنواره‌ی ماست: همه‌ی آثار را هیئت داوران می‌شنود و هنرمندانِ برگزیده به آلبومِ مجموعه‌ی سالانه‌ی لیبل دعوت می‌شوند."
guidelines_en:
  - Festival entries — songs, music videos, compositions, vocal performances and poetry set to music — go through the festival page. Entry is free for the first edition.
  - Outside the festival, you can still send 2–3 tracks in their current form, polished or not, with a few sentences about the story behind them.
  - No press kit, no pitch deck. Just the music.
guidelines_fa:
  - آثارِ جشنواره — ترانه، موزیک‌ویدیو، آهنگسازی، اجرای آوازی و شعرِ همراه با موسیقی — از طریقِ صفحه‌ی جشنواره ارسال می‌شوند. ارسال در دوره‌ی نخست رایگان است.
  - خارج از جشنواره هم می‌توانید ۲ تا ۳ قطعه را، به همان شکلی که هست، همراه با چند جمله درباره‌ی داستانِ پشتِ آن‌ها بفرستید.
  - نه پرس‌کیت، نه پیچ‌دک. فقط موسیقی.
note_en: Artists keep full ownership of their work. Every submission is listened to — even when we can't reply to each one.
note_fa: مالکیتِ اثر به‌طورِ کامل نزدِ هنرمند می‌ماند. به همه‌ی آثار گوش داده می‌شود — حتی وقتی نتوانیم به تک‌تکشان پاسخ دهیم.
