consentRights_fa: این ترانه اثرِ خودِ من است، یا اجازه‌ی صاحبِ اثر را برای ارسالش دارم.
consentAlbum_en: "If selected, I give Azadichords a non-exclusive permission to produce this song and release it on an Azadichords album. I am credited as its author and keep ownership of my work; final terms are agreed in writing with each selected artist."
consentAlbum_fa: "اگر ترانه‌ام برگزیده شود، به آکوردهای آزادی اجازه‌ی غیرانحصاری می‌دهم که آن را تولید کند و در یک آلبومِ آکوردهای آزادی منتشر کند. نامم به‌عنوانِ صاحبِ اثر درج می‌شود و مالکیتِ اثر نزدِ خودم می‌ماند. شرایطِ نهایی با هر برگزیده به‌صورتِ کتبی توافق می‌شود."
