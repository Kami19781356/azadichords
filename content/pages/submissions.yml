# Submission form for the festival's two song sections — special (Persian
# songs in memory of Iran's Javidnaman) and international (any language,
# any theme). Music videos for the general section go through FilmFreeway
# instead (generalCtaHref).
eyebrow_en: Submit · Songs
eyebrow_fa: ارسالِ اثر · ترانه
title_en: Send Us Your Song
title_fa: ترانه‌ات را بفرست
intro_en: "The Azadichords Song Festival has two song sections: a special section for songs written for the road to freedom, in memory of those who have fallen on it, and an international section for songs in any language on any theme. Send the lyrics alone, or with a melody or demo. Nine winning songs, chosen from both sections, will be produced by the Azadichords team and released on one international album, «Freedom Chords»."
intro_fa: "جشنواره‌ی ترانه‌ی آکوردهای آزادی دو بخشِ ترانه دارد: بخشِ ویژه برای ترانه‌های فارسی به یادِ جاویدنامانِ ایران، و بخشِ بین‌المللی برای ترانه‌هایی به هر زبان و با هر موضوع. می‌توانی فقط متنِ ترانه را بفرستی یا آن را همراه با ملودی یا دمو ارسال کنی. از میانِ ترانه‌های هر دو بخش، نُه ترانه‌ی برنده را تیمِ آکوردهای آزادی تولید می‌کند و در یک آلبومِ بین‌المللی به نامِ «آکوردهای آزادی» (Freedom Chords) منتشر می‌شوند."
guidelines_en:
  - Special section — songs in any language, written for the road to freedom or in memory of those who have fallen on it. International section — songs in any language, on any theme.
  - The song must be your own work (or sent with its author's permission).
  - A stage name is enough. Your real name is not required.
  - For a demo, share a link — Google Drive, WeTransfer, SoundCloud or similar. Files are not uploaded to this site.
  - Deadline — December 27, 2026. Submitting is free.
guidelines_fa:
  - "بخشِ ویژه — ترانه‌ی فارسی به یادِ جاویدنامانِ ایران. بخشِ بین‌المللی — ترانه به هر زبان و با هر موضوع."
  - ترانه باید اثرِ خودت باشد، یا با اجازه‌ی صاحبِ اثر فرستاده شود.
  - نامِ هنری کافی است و نامِ واقعی لازم نیست.
  - اگر دمو داری، لینکش را بگذار (گوگل‌درایو، WeTransfer، ساوندکلاود یا هر سرویسِ مشابه). فایلی روی این سایت آپلود نمی‌شود.
  - مهلتِ ارسال ۲۷ دسامبر ۲۰۲۶ (۶ دی ۱۴۰۵) است و ارسال رایگان است.
safetyNote_en: "If you are writing from inside Iran: use an email address that is not tied to your real name. We never publish anything about you without your explicit consent, and this site uses no tracking or analytics."
safetyNote_fa: "اگر داخلِ ایران هستی، از ایمیلی استفاده کن که به نامِ واقعی‌ات نیست. ما هیچ اطلاعاتی از تو را بدون رضایتِ صریحِ خودت منتشر نمی‌کنیم، و این سایت هیچ ابزارِ ردیابی یا آنالیتیکسی ندارد."
