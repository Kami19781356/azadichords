eyebrow_en: Submissions
eyebrow_fa: ارسال اثر
title_en: For the Next Voice
title_fa: برای صدای بعدی
intro_en: "If your voice is something that can't stay silent, we want to hear it. Azadichords is looking for artists whose music and poetry come from a belief, not just a genre. Send us your work."
intro_fa: "اگه صدات چیزیه که نمی‌تونه ساکت بمونه، می‌خوایم بشنویمش. آزادی‌کورد به‌دنبالِ هنرمندانیه که موسیقی و شعرشون از یک باور میاد، نه فقط یک ژانر. کارت رو برامون بفرست."
guidelines_en:
  - 2–3 tracks, in their current form — polished or not.
  - A few sentences about the work and the story behind it.
  - No press kit, no pitch deck. Just the music.
guidelines_fa:
  - ۲ تا ۳ ترک، به همون شکلی که الان هست — چه نهایی باشه چه نه.
  - چند جمله درباره‌ی اثر و داستانِ پشتِ اون.
  - نه پرس‌کیت، نه پیچ‌دک. فقط موسیقی.
note_en: Submissions are reviewed as time allows. Not every submission gets a reply — but every one gets heard.
note_fa: آثارِ ارسالی در حدِ زمانِ موجود بررسی می‌شن. به هر ارسالی جواب داده نمی‌شه — ولی به همه گوش داده می‌شه.
