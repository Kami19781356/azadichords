# Submission form for the festival's special section (Persian songs in
# memory of Iran's Javidnaman). Music videos for the general section go
# through FilmFreeway instead (generalCtaHref).
eyebrow_en: Submit · Special Section
eyebrow_fa: ارسالِ اثر · بخشِ ویژه
title_en: Send Us Your Song
title_fa: ترانه‌ات را بفرست
intro_en: "The special section of the Azadichords Song Festival is for Persian songs written in memory of Iran's Javidnaman. Send the lyrics alone, or with a melody or demo. Nine selected songs will be produced by the Azadichords team and released on the album «Azadichords»."
intro_fa: "بخشِ ویژه‌ی جشنواره‌ی ترانه‌ی آکوردهای آزادی برای ترانه‌های فارسی به یادِ جاویدنامانِ ایران است. می‌توانی فقط متنِ ترانه را بفرستی یا آن را همراه با ملودی یا دمو ارسال کنی. نُه ترانه‌ی برگزیده را تیمِ آکوردهای آزادی تولید می‌کند و در آلبومِ «آکوردهای آزادی» منتشر می‌شوند."
guidelines_en:
  - The song must be in Persian and your own work (or sent with its author's permission).
  - A stage name is enough. Your real name is not required.
  - For a demo, share a link — Google Drive, WeTransfer, SoundCloud or similar. Files are not uploaded to this site.
  - Deadline — December 6, 2026. Submitting is free.
guidelines_fa:
  - ترانه باید فارسی و اثرِ خودت باشد، یا با اجازه‌ی صاحبِ اثر فرستاده شود.
  - نامِ هنری کافی است و نامِ واقعی لازم نیست.
  - اگر دمو داری، لینکش را بگذار (گوگل‌درایو، WeTransfer، ساوندکلاود یا هر سرویسِ مشابه). فایلی روی این سایت آپلود نمی‌شود.
  - مهلتِ ارسال ۶ دسامبر ۲۰۲۶ (۱۵ آذر ۱۴۰۵) است و ارسال رایگان است.
safetyNote_en: "If you are writing from inside Iran: use an email address that is not tied to your real name. We never publish anything about you without your explicit consent, and this site uses no tracking or analytics."
safetyNote_fa: "اگر داخلِ ایران هستی، از ایمیلی استفاده کن که به نامِ واقعی‌ات نیست. ما هیچ اطلاعاتی از تو را بدون رضایتِ صریحِ خودت منتشر نمی‌کنیم، و این سایت هیچ ابزارِ ردیابی یا آنالیتیکسی ندارد."
