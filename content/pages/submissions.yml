fieldDemoUrl_fa: لینکِ دمو (اختیاری)
fieldNote_en: Anything else you want us to know (optional)
fieldNote_fa: اگر نکته‌ای هست که باید بدانیم (اختیاری)
consentRights_en: This song is my own work, or I have its author's permission to submit it.
consentRights_fa: این ترانه اثرِ خودِ من است، یا اجازه‌ی صاحبِ اثر را برای ارسالش دارم.
consentAlbum_en: "If selected, I give Azadichords a non-exclusive permission to produce this song and release it on the album «Azadichords». I am credited as its author and keep ownership of my work; final terms are agreed in writing with each selected artist."
consentAlbum_fa: "اگر ترانه‌ام برگزیده شود، به آکوردهای آزادی اجازه‌ی غیرانحصاری می‌دهم که آن را تولید کند و در آلبومِ «آکوردهای آزادی» منتشر کند. نامم به‌عنوانِ صاحبِ اثر درج می‌شود و مالکیتِ اثر نزدِ خودم می‌ماند. شرایطِ نهایی با هر برگزیده به‌صورتِ کتبی توافق می‌شود."
submitLabel_en: Send my song
submitLabel_fa: ارسالِ ترانه
sendingLabel_en: Sending…
sendingLabel_fa: در حالِ ارسال…
successMessage_en: "Received. Thank you — every song is read and listened to. Selections are announced on December 20, 2026."
successMessage_fa: "دریافت شد، ممنون. همه‌ی ترانه‌ها خوانده و شنیده می‌شوند. آثارِ برگزیده ۲۰ دسامبر ۲۰۲۶ (۲۹ آذر ۱۴۰۵) اعلام می‌شوند."
closedMessage_en: "Submissions open on October 19, 2026. Come back then — the form will be ready for your song."
closedMessage_fa: "ارسالِ ترانه از ۱۹ اکتبر ۲۰۲۶ (۲۷ مهر ۱۴۰۵) آغاز می‌شود. همان روز برگرد؛ فرم برای ترانه‌ی تو آماده است."
errorMessage_en: "Something went wrong. Please try again in a few minutes, or email the song to contact@azadichords.com."
errorMessage_fa: "مشکلی پیش آمد. چند دقیقه‌ی دیگر دوباره امتحان کن، یا ترانه را به contact@azadichords.com ایمیل کن."
generalNote_en: "Making a music video instead? The general section — love, social and spiritual music videos from anywhere — takes submissions through FilmFreeway."
generalNote_fa: "موزیک‌ویدیو ساخته‌ای؟ بخشِ عمومی (موزیک‌ویدیوهای عاشقانه، اجتماعی و معنوی از هر جای جهان) آثار را از طریقِ FilmFreeway می‌پذیرد."
