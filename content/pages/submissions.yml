successMessage_en: "Received. Thank you — every song is read and listened to. Selections are announced on January 15, 2027."
successMessage_fa: "دریافت شد، ممنون. همه‌ی ترانه‌ها خوانده و شنیده می‌شوند. آثارِ برگزیده ۱۵ ژانویه ۲۰۲۷ (۲۵ دی ۱۴۰۵) اعلام می‌شوند."
closedMessage_en: "Submissions open on October 19, 2026. Come back then — the form will be ready for your song."
