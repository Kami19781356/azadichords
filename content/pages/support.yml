eyebrow_en: Support
eyebrow_fa: حمایت
title_en: Stand Behind the Voice
title_fa: پشتِ این صدا بایستید
intro_en:
  - Azadichords is fully independent — no sponsor, no institution, no gatekeeper. Our songs are free for listeners inside Iran. Everyone else can help keep it that way.
  - There is no payment on this site. Each way to support below leads to the place where it actually happens.
intro_fa:
  - آکوردهای آزادی کاملاً مستقل است و هیچ اسپانسر، نهاد یا دروازه‌بانی ندارد. ترانه‌هایمان برای مخاطبانِ داخلِ ایران رایگان است، و بقیه می‌توانند کمک کنند که همین‌طور بماند.
  - روی این سایت هیچ پرداختی انجام نمی‌شود. هر راهِ حمایتی که در ادامه می‌بینید، شما را به جایی می‌برد که آن حمایت واقعاً اتفاق می‌افتد.
ways:
  - name: "01"
    title_en: Own the Work
    title_fa: آثار را تهیه کنید
    description_en: "The album «Iran-e Jan» — Kamran Rasoolzadeh's newest album, in remembrance of the names of the homeland's Javidnaman — together with Kamran's new poetry collection."
    description_fa: "آلبومِ «ایرانِ جان»، تازه‌ترین آلبومِ کامران رسول‌زاده (پاسداشتِ نامِ جاویدنامانِ وطن)، به همراهِ مجموعه‌شعرِ تازه‌ی کامران."
    ctaLabel_en: Go to the studio →
    ctaLabel_fa: رفتن به استودیو ←
    ctaHref: https://www.youality.fr
    soonNote_en: Pre-sale begins soon…
    soonNote_fa: آغازِ پیش‌فروش، به‌زودی…
  - name: "02"
    title_en: Listen and Share
    title_fa: بشنوید و به اشتراک بگذارید
    description_en: Stream on Spotify, Apple Music and YouTube. Every share is an effective effort to carry this song to the families of Iran's Javidnaman, and to keep their memory alive forever.
    description_fa: در اسپاتیفای، اپل‌موزیک و یوتیوب بشنوید. اگر داخلِ ایران هستید، از همین سایت دانلود کنید و برای دیگران بفرستید. هر اشتراک‌گذاری تلاشی‌ست مؤثر برای رساندنِ این آهنگ به بازماندگانِ جاویدنام‌ها و زنده نگه‌داشتنِ یادشان تا ابد.
    ctaLabel_en: Go to the music →
    ctaLabel_fa: رفتن به موسیقی ←
    ctaHref: /music
  - name: "03"
    title_en: Be in the Room
    title_fa: در سالن باشید
    description_en: January 8–9, 2027 in Paris — screenings, the awards, and a live music performance on closing night.
    description_fa: ۸ و ۹ ژانویه ۲۰۲۷ (۱۸ و ۱۹ دی ۱۴۰۵) در پاریس، با نمایش و شنیدنِ آثار، اهدای جوایز و اجرای زنده‌ی موسیقی در شبِ اختتامیه.
    ctaLabel_en: The festival →
    ctaLabel_fa: جشنواره ←
    ctaHref: /festival
  - name: "04"
    title_en: Partner With Us
    title_fa: همراهِ ما شوید
    description_en: Venues, media, cultural organisations and patrons who want to help bring free voices to a stage — we would like to hear from you.
    description_fa: سالن‌ها، رسانه‌ها، نهادهای فرهنگی و حامیانی که می‌خواهند صداهای آزاد را به صحنه برسانند، مشتاقیم از شما بشنویم.
    ctaLabel_en: Get in touch →
    ctaLabel_fa: تماس بگیرید ←
    ctaHref: /contact
transparency_en: Azadichords never asks for payment on this site. Direct sales are handled by the artist's studio.
transparency_fa: آکوردهای آزادی روی این سایت هرگز درخواستِ پرداخت نمی‌کند. فروشِ مستقیم از طریقِ استودیوی هنرمند انجام می‌شود.
