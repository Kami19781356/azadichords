transparency_en: All proceeds go directly to production and live performance costs. No intermediary, no committee.
transparency_fa: تمامِ درآمد مستقیم صرفِ هزینه‌های تولید و اجرای زنده می‌شه. بدونِ واسطه، بدونِ کمیته.
