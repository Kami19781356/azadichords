eyebrow_en: Services
eyebrow_fa: خدمات
title_en: What the Label Offers
title_fa: آنچه لیبل ارائه می‌دهد
intro_en: Beyond release, Azadichords works alongside the artists it houses at every stage a record needs before it reaches an audience.
intro_fa: فراتر از انتشار، آزادی‌کورد در تمامِ مراحلی که یک اثر پیش از رسیدن به مخاطب طی می‌کنه، کنارِ هنرمندانش می‌ایسته.
services:
  - title_en: Production & Mixing
    title_fa: تولید و میکس
    description_en: Studio time, arrangement, and audio engineering support, from first draft to final master.
    description_fa: زمانِ استودیو، تنظیم، و پشتیبانیِ مهندسیِ صدا، از اولین پیش‌نویس تا مسترِ نهایی.
  - title_en: Distribution
    title_fa: توزیع
    description_en: Placing the work on every major platform, worldwide, under the artist's own name.
    description_fa: قرار دادنِ اثر روی تمامِ پلتفرم‌های اصلی، در سراسرِ دنیا، زیرِ نامِ خودِ هنرمند.
  - title_en: Visual Identity
    title_fa: هویت بصری
    description_en: Album art, music videos, and the visual language that carries a record beyond its audio.
    description_fa: طراحیِ کاورِ آلبوم، موزیک‌ویدیو، و زبانِ بصری‌ای که اثر را فراتر از صدایش می‌برد.
  - title_en: Live Performance
    title_fa: اجرای زنده
    description_en: From a first show to a touring itinerary — the logistics behind bringing a record to a stage.
    description_fa: از اولین اجرا تا برنامه‌ی یک تور — تمامِ لجستیکِ رسوندنِ یک اثر به روی صحنه.
  - title_en: Licensing & Publishing
    title_fa: لایسنس و نشر
    description_en: Protecting the work and placing it commercially, on terms the artist understands and agrees to.
    description_fa: محافظت از اثر و قرار دادنِ آن در بازار، با شرایطی که هنرمند می‌فهمد و باهاش موافقه.
ctaLabel_en: Working on something that belongs here? Get in Touch →
ctaLabel_fa: کاری داری که اینجا جاش هست؟ تماس بگیر ←
